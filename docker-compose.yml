name: ai-saas-starter

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:3000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ai_saas
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  # AI — empty keys fall back to the built-in demo model
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-fake}
  AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-fake}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
  AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.5-flash-lite,gemini-3.8-flash,gemini-3.5-flash}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  # Stripe — optional
  STRIPE_KEY: ${STRIPE_KEY:-}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_saas"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: "true"
    ports: ["8000:8000"]
    volumes:
      - uploads:/var/www/html/storage/app
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  queue:
    build: ./backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=600"]
    environment: *api-env
    volumes:
      - uploads:/var/www/html/storage/app
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: { condition: service_started }

  scheduler:
    build: ./backend
    command: ["php", "artisan", "schedule:work"]
    environment: *api-env
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_NAME: Margin
        # Local demo only: shows the seeded sign-in details on the login page
        NEXT_PUBLIC_SHOW_DEMO_LOGIN: "true"
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  uploads:
